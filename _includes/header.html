<header class="masthead">
  <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.name | escape }}, home">
    {% include seal.html %}
    <span class="brand-name">{{ site.name | escape }}</span>
  </a>
  <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav">Menu</button>
  <nav id="site-nav" class="site-nav" aria-label="Main">
    <ul>
      {%- for link in site.data.navigation %}
      <li><a href="{{ link.link | relative_url }}" data-group="{{ link.group | escape }}"{% if page.group == link.group %} aria-current="page"{% endif %}>{{ link.name | escape }}</a></li>
      {%- endfor %}
    </ul>
  </nav>
</header>
